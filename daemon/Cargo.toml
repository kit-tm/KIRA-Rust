[package]
name = "r2kad-daemon"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
bench = ["log/release_max_level_off"]

[lib]
name = "r2kad_daemon_lib"
path = "src/lib.rs"

[[bin]]
name = "r2kad-daemon"
path = "src/main.rs"

[dependencies]
chrono = "0.4.22"
clap = { version = "4.0.8", features = ["derive", "env"] }
env_logger = "0.9.0"
futures = "0.3.25"
humantime = "2.1.0"
log = "0.4.17"
r2kad-lib = { path = "../lib", features = ["serde", "udp-tokio", "rmp-serde", "in-memory-message-channel"] }
rmp-serde = "1.1.0"
signal-hook = "0.3.14"
signal-hook-tokio = { version = "0.3.1", features = ["futures-v0_3"] }
tokio = { version = "1.20.1", features = ["macros", "time", "net", "rt", "signal"] }
# todo make optional
axum = { version = "0.6", features = ["json"] }
axum-macros = "0.4.0"
serde = { version = "1.0.193", features = ["derive"] }
serde_derive = "1.0.193"
hex = "0.4.3"
# todo make optional and support other hashing algorithms
sha2 = "0.10.8"
base64 = "0.21.6"

[dev-dependencies]
anyhow = "1.0.66"
async-trait = "0.1.57"
chrono = "0.4.22"
log4rs = "1.1.1"
ntest = "0.8.1"
petgraph = { version = "0.6.2", features = ["serde", "serde-1"] }
