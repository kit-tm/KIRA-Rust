[package]
name = "r2kad-daemon"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "3.2.17", features = ["derive", "env"] }
env_logger = "0.9.0"
log = "0.4.17"
r2kad-lib = { path = "../lib", features = ["serde", "udp-tokio", "rmp-serde"] }
rmp-serde = "1.1.0"
tokio = { version = "1.20.1", features = ["macros", "time", "net", "rt"] }
