services:
  node-1:
    image: r2kad-daemon:scratch
    environment:
      NODE_ID: "0100000000000000000000000000"
      RUST_LOG: "debug"
    expose:
      - "8080"
    networks:
      mynetv6-1:
        ipv6_address: "2001:db8:1::10"
  node-2:
    image: r2kad-daemon:scratch
    environment:
      NODE_ID: "0200000000000000000000000000"
      RUST_LOG: "debug,routing_table=trace"
    expose:
      - "8080"
    networks:
      mynetv6-1:
        ipv6_address: "2001:db8:1::11"
      mynetv6-2:
        ipv6_address: "2001:db8:2::12"
  node-3:
    image: r2kad-daemon:scratch
    environment:
      NODE_ID: "0300000000000000000000000000"
      RUST_LOG: "debug"
    expose:
      - "8080"
    networks:
      mynetv6-2:
        ipv6_address: "2001:db8:2::13"

networks:
  mynetv6-1:
    external: true
  mynetv6-2:
    external: true
