spec:
  inputs:
    release_build:
      type: boolean
      default: false
      description: "Set to true to build release artifacts"
    debug_mode:
      type: boolean
      default: false
      description: "Run debug jobs of the pipeline"
    rustc_wrapper:
      type: string
      default: sccache
    rust_version:
      type: string
      default: 1.97
      description: "Version of Rust"

---

variables:
  CI_IMAGE_TAG: $CI_DEFAULT_BRANCH

.rust_image_paths: &rust_image_paths
  - docker/Dockerfile.ci
  - .gitlab-ci/ci-image.yml

workflow:
  rules:
    # Overwritten CI image tag by $CI_COMMIT_REF_SLUG on changes to the image
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *rust_image_paths
      variables:
        CI_IMAGE_TAG: $CI_COMMIT_REF_SLUG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *rust_image_paths
      variables:
        CI_IMAGE_TAG: $CI_COMMIT_REF_SLUG

    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

.semver_release_rule:
  rules:
    # matches semver release tags "v1.2.3"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      interruptible: false

.force_release_build_artifacts:
  rules:
    - if: '"$[[ inputs.release_build ]]" == "true"' # force build
      when: always

include:
  - local: '.gitlab-ci/ci-image.yml'
    inputs:
      rust_version: $[[ inputs.rust_version ]]
      rust_image: $CI_REGISTRY_IMAGE/rust-ci:$CI_IMAGE_TAG
      rust_image_default: $CI_REGISTRY_IMAGE/rust-ci:$CI_DEFAULT_BRANCH

  - local: '.gitlab-ci/rust.yml'
    inputs:
      debug_mode: $[[ inputs.debug_mode ]]
      rustc_wrapper: $[[ inputs.rustc_wrapper ]]
      rust_image: $CI_REGISTRY_IMAGE/rust-ci:$CI_IMAGE_TAG
      sccache_dir: /sccache
      common_job_tags:
        - rust
        - sccache

stages:
  - debug         # pipeline debug jobs
  - lint          # fast lints
  - check         # in-depth code checks
  - test          # unit-, integration, doc-tests
  - build         # build kirad binaries
  - security      # security audits (cargo-audit)
  - release       # make releases


# allow successful merger even if no pipeline jobs where created because nothing was changed
no-checks:
  image: alpine
  stage: check
  script:
    - echo "Files changed not guarded by checks."
    - exit 1
  allow_failure: true # warn of absent checks

  rules:
    - changes: !reference [.rust_paths]
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always

# TODO: Build and release docker images on release


release:
  image: registry.gitlab.com/gitlab-org/cli:latest
  stage: release
  extends: .semver_release_rule
  script:
    - echo "Creating release..."
    - tar -czvf docs.tar.gz -C doc .

  needs:
    - build-rustdoc
    - build-kirad-release

  artifacts:
    paths:
      - kirad-*.tar.gz
      - docs.tar.gz
  release:
    name: "Release $CI_COMMIT_TAG"
    description: "Release created from tag $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
