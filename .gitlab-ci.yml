spec:
  inputs:
    release_build:
      type: boolean
      default: false
      description: "Set to true to build release artifacts"

---

.semver_release_rule:
  rules:
    # matches semver release tags "v1.2.3"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
      variables:
        RUSTDOCFLAGS: "-Dwarnings" # prohibit publishing of incomplete rustdoc
      interruptible: false

.force_release_build_artifacts:
  rules:
    - if: '"$[[ inputs.release_build ]]" == "true"' # force build
      when: always

include:
  - local: 'ci/rust.gitlab-ci.yml'

stages:
  - lint          # fast lints
  - check         # in-depth code checks
  - test          # unit-, integration, doc-tests
  - build         # build kirad binaries
  - security      # security audits (cargo-audit)
  - release       # make releases

# TODO: build and release docker containers on release

release:
  stage: release
  extends: .semver_release_rule
  image: alpine/git:latest
  script:
    - echo "Creating release..."

  artifacts:
    paths:
      - release-artifacts/
  release:
    name: "Release $CI_COMMIT_TAG"
    description: "Release created from tag $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
