table ip6 kira {

    # TODO remove tracing

    # MagicIP remote: beef::b
    # MagicIP local:  beef::a

    # This set contains all PathIDs that end on this host. 
    # All packets with matching destinations will be decapsulated.
    set localpathids {
        type ipv6_addr
    }

    # This set contains all NodeIDs that must be encapsulated.
    # This is a duplicate of the key set from the nodeidtopathid map.
    # This is a workaround until a way is found to check if a key exists in a map.
    set encapsulate {
        type ipv6_addr
    }

    # This map contains all configured outgoing paths. 
    # Maps NodeIP -> PathIP.
    # All locally generated packets with destination NodeIP will be encapsulated and sent to PathIP.
    map nodeidtopathid {
        type ipv6_addr : ipv6_addr
    }

    # This map contains the paths this host will forward packets along.
    # Maps Incoming PathIP -> Outgoing PathIP.
    # Packets will not be decapsulated.
    map pathidtopathid {
        type ipv6_addr : ipv6_addr
    }

    chain hookout {
        type route hook output priority 0; policy accept;
        meta nftrace set 1
        ip6 daddr != fc00::/16 accept
        ip6 daddr @encapsulate meta mark set 0xff00
    }

    # This chain matches all incoming PathIP packets and marks packets that should be decapsulated.
    # It also forwards PathIP packets along the configured paths.
    chain hookin {
        type filter hook prerouting priority raw; policy accept;
        meta nftrace set 1
        ip6 daddr != fcaa::/16 accept
        ip6 daddr @localpathids meta mark set 0xff00 accept
        ip6 daddr fcaa::/16 ip6 daddr set ip6 daddr map @pathidtopathid
    }

    # This chain matches all packets sent through the dummy encapsulation ip6gre interface.
    # It extracts the inner destination IP (NodeIP) and corrects the outer destination IP accordingly.
    chain correctdestination {
        type filter hook output priority 0; policy accept;
        meta nftrace set 1
        ip6 saddr != beef::a ip6 daddr != beef::b accept
        ip6 saddr set @th,96,128
        ip6 daddr set @th,224,128
        ip6 daddr set ip6 daddr map @nodeidtopathid
        meta mark set 0
    }
    
}
