spec:
  inputs:
    rust_version:
      type: string
      default: ""
      description: "Override the Rust version baked into the CI image (empty: use the Dockerfile's ARG default)"
    rust_image:
      type: string
      description: "Publish name of the Rust CI image"
    rust_image_default:
      type: string
      description: "Fallback Rust CI image (caching)"
    image_default_tag:
      type: string
      default: $CI_DEFAULT_BRANCH
---

variables:
    RUST_CI_IMAGE: $[[ inputs.rust_image ]]
    RUST_CI_IMAGE_DEFAULT: $[[ inputs.rust_image_default ]]
    RUST_VERSION: $[[ inputs.rust_version ]]

.rust_image_paths: &rust_image_paths
  - docker/Dockerfile.ci
  - .gitlab-ci/ci-image.yml

build-rust-ci-image:
  stage: .pre
  extends: .buildkit-base
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 \
        --local context=. \
        --local dockerfile=docker \
        --opt filename=Dockerfile.ci \
        ${RUST_VERSION:+--opt=build-arg:RUST_VERSION=${RUST_VERSION}} \
        --import-cache "type=registry,ref=${RUST_CI_IMAGE_DEFAULT}" \
        --output "type=image,name=${RUST_CI_IMAGE},push=true"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *rust_image_paths
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *rust_image_paths
    # only on the default branch: elsewhere CI_IMAGE_TAG is $CI_DEFAULT_BRANCH and the
    # build would overwrite the default branch's image with this branch's Dockerfile
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
