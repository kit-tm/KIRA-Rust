repos:
  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
        args: [--unsafe] # required for gitlab-ci scripts
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: trailing-whitespace
      - id: check-added-large-files

  # Rust (cargo managed)
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo +nightly fmt
        args: ["--"]
        language: system
        types: [file, rust]
        stages:
          - pre-commit
          - pre-merge-commit
          - manual

      - id: rustdoc
        name: cargo doc
        entry: env RUSTDOCFLAGS="-Dwarnings" cargo doc --workspace --no-deps
        language: system
        types: [file, rust]
        pass_filenames: false
        stages:
          - pre-push
          - pre-merge-commit
          - manual

      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace --all-targets --all-features
        language: system
        types: [file]
        files: ^.*(Cargo\.toml|Cargo\.lock|.*\.rs)$
        pass_filenames: false
        stages:
          - pre-commit
          - pre-merge-commit
          - pre-push
          - manual

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [file, rust]
        pass_filenames: false
        stages:
          - pre-commit
          - pre-merge-commit
          - pre-push
          - manual

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --all-features
        language: system
        types: [rust]
        pass_filenames: false
        stages:
          - pre-push
          - pre-merge-commit
          - manual

  # Python (kira-test, uv managed)
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock check (kira-test)
        entry: uv --project tests/kira-test lock --check
        language: system
        files: ^tests/kira-test/(.*pyproject\.toml|uv\.lock)$
        pass_filenames: false
        stages:
          - pre-commit
          - pre-merge-commit
          - pre-push
          - manual

      - id: ruff-check
        name: ruff check (kira-test)
        entry: uv run --project tests/kira-test ruff check --fix
        language: system
        types: [file, python]
        files: ^tests/kira-test/
        pass_filenames: true
        stages:
          - pre-commit
          - pre-merge-commit
          - manual

      - id: ruff-format
        name: ruff format (kira-test)
        entry: uv run --project tests/kira-test ruff format
        language: system
        types: [file, python]
        files: ^tests/kira-test/
        pass_filenames: true
        stages:
          - pre-commit
          - pre-merge-commit
          - manual
