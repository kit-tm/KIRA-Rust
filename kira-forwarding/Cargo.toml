[package]
name = "kira-forwarding"
version = "0.1.0"
description = "KIRA fast forwarding implementations"
license.workspace = true
authors.workspace = true
homepage.workspace = true
edition.workspace = true

[features]
default = ["nft"]
# GRE encapsulation managed by nftables
nft = ["netlink"]
# SRv6 encapsulation with an eBPF program handling the PathIDs.
# Building the eBPF program requires a nightly toolchain with the `rust-src` component
# and `bpf-linker`.
srv6 = ["nft", "aya", "aya-build", "kira-forwarding-common/user", "tokio/net", "tokio/macros"]
netlink = [
  "netlink-proto",
  "netlink-packet-core",
  "netlink-packet-netfilter",
  "netlink-packet-route",
  "futures",
]

[dependencies]
log = { workspace = true }
# common domain layer
kira-r2kad = { path = "../kira-r2kad", default-features = false }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true, features = ["attributes"] }
derive_more = { workspace = true }
netlink-proto = { workspace = true, optional = true }
netlink-packet-core = { workspace = true, optional = true }
netlink-packet-netfilter = { workspace = true, optional = true }
netlink-packet-route = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
trait-variant = { workspace = true }
# eBPF program management of the SRv6 forwarding
aya = { workspace = true, optional = true }
kira-forwarding-common = { path = "../kira-forwarding-common", optional = true }

[build-dependencies]
aya-build = { workspace = true, optional = true }
