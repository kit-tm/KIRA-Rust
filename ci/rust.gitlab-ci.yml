# common rust job
.rust-defaults:
  image: rust:latest
  cache:
    key: cargo-cache
    paths:
      - .cargo/ # cargo registry
      - target/ # build artifacts
  interruptible: true

# rust job that is run if rust code changed by a merge request
.rust-ci-rules:
  extends: .semver_release_rule
  rules:
    - !reference [.semver_release_rule, rules] # merge rules
    # only run manually on Draft-MR
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^Draft:/
      when: manual
    # automatically run on MR and pushes
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - "**/*.rs"
        - "**/Cargo.toml"
        - "**/Cargo.lock"
    # automatically run on commit tags
    - if: $CI_COMMIT_TAG
      changes:
        paths:
          - "**/*.rs"
          - "**/Cargo.toml"
          - "**/Cargo.lock"
        compare_to: $CI_DEFAULT_BRANCH
    # allows force-run if detection fails
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_TAG
      when: manual
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
stages:
  - check
  - test
  - build
  - security
  - release

# ==================== #
#         Jobs         #
# ==================== #

cargo_check:
  stage: check
  extends:
    - .rust-defaults
    - .rust-ci-rules

  # fail-fast if packages can't be compiled
  script:
    - cargo check --workspace --all-targets --all-features
 
clippy_check:
  stage: check
  extends:
    - .rust-defaults
    - .rust-ci-rules

  before_script:
    - rustup component add clippy
  script:
    - cargo clippy --workspace --all-targets --all-features -- -D warnings

rustfmt_check:
  stage: check
  extends:
    - .rust-defaults
    - .rust-ci-rules

  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt --all --check

rustdoc_check:
  stage: check
  extends:
    - .rust-defaults
    - .rust-ci-rules

  script:
    - cargo doc --workspace --no-deps

  variables:
    RUSTDOCFLAGS: "-Dwarnings"

rust-test:
  stage: test
  extends:
    - .rust-defaults
    - .rust-ci-rules

  before_script:
    - cargo install cargo-nextest --locked
  script:
    - cargo nextest run --workspace --all-features --all-targets

# doctests unsupported in nextest (https://github.com/nextest-rs/nextest/issues/16)
rust-doctests: 
  stage: test
  extends:
    - .rust-defaults
    - .rust-ci-rules

  script:
    - cargo test --workspace --all-features --doc 

build_kirad:
  image: rust:alpine
  stage: build
  extends:
    - .rust-defaults
    - .rust-ci-rules

  before_script:
    - apk add --no-cache musl-dev git
  script:
    - cargo build --package kirad

release:build:kirad:
  image: rust:alpine
  stage: build
  extends: 
    - .rust-defaults
    - .semver_release_rule 

  before_script:
    - apk add --no-cache musl-dev git
    - rustup target add $TARGET_TRIPLE
  script:
    - cargo build --release --package kirad --target $TARGET_TRIPLE
    - mkdir -p release_artifacts/bin
    - tar -czvf release_artifacts/bin/kirad-$TARGET_TRIPLE.tar.gz -C target/$TARGET_TRIPLE/release kirad

  parallel:
    matrix:
      - TARGET_TRIPLE:
        - x86_64-unknown-linux-musl 
        # - aarch64-unknown-linux-musl # TODO: support cross-compilation for aarch64

  artifacts:
    paths:
      - release_artifacts/bin/
    name: "kirad-$TARGET_TRIPLE"
    expire_in: 1 day

release:build:rustdoc:
  stage: build
  extends: 
    - .rust-defaults
    - .semver_release_rule 

  script:
    - cargo build --doc --workspace --no-deps
    - mkdir -p release_artifacts/docs
    - tar -czvf release_artifacts/docs/rustdocs.tar.gz -C target/doc .

  artifacts:
    paths:
      - "release_artifacts/docs"
    name: "rustdocs"
    expire_in: 1 day

cargo_audit:
  stage: security
  extends:
    - .rust-defaults
    - .rust-ci-rules

  before_script:
    - cargo install cargo-audit --locked
  script:
    - cargo audit

  rules:
    - !reference [.rust-ci-rules, rules] # merge rules
    - if: $CI_PIPELINE_SOURCE == "schedule" # scheduled nightly runs
