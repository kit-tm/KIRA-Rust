[project]
name = "kira-gml"
version = "0.0.1"
description = "Manipulating GML files for testing"
readme = "README.md"
authors = [{ name = "Julius Rüberg", email = "julius.rueberg@student.kit.edu" }]
requires-python = ">=3.12"
dependencies = ["kira-common", "networkx==3.4.2", "matplotlib==3.10.3"]

[project.scripts]
alter_gml_config = "kira_gml.alter_gml_config:alter_gml_config"
generate_random_gml = "kira_gml.generate_random_gml:generate_random_gml"
show_graph = "kira_gml.show_graph:show_graph"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
