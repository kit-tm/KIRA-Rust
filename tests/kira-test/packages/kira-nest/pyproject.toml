[project]
name = "kira-nest"
version = "0.0.1"
description = "Testing infrastructure of kirad with NeST"
readme = "README.md"
authors = [
  { name = "Julius Rüberg", email = "julius.rueberg@student.kit.edu" },
  { name = "Jakob Müllner ", email = "uifnz@student.kit.edu" },
]
requires-python = ">=3.12"
dependencies = [
  "kira-common",
  "nest @ git+https://gitlab.com/Toorero/nest.git@feature/cap_sys_admin", # https://gitlab.com/nitk-nest/nest/-/work_items/283
  "networkx==3.6.1",
  "scipy==1.18.0",
  "term-image==0.7.2",
  "matplotlib==3.11.1",
]

[project.scripts]
nesttest = "kira_nest.nest.shell:run_shell"

[dependency-groups]
dev = [
  "pytest>=9.1.0",
  "pytest-randomly>=4.1.0",
  "ruff>=0.16.2",
  "pyright>=1.1.407",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.13.0"]
build-backend = "uv_build"
