services:
  opensearch:
    image: opensearchproject/opensearch:2
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - http.host=0.0.0.0
      - transport.host=127.0.0.1
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=__iNw.bQ9S # not actually needed but required
      - OPENSEARCH_JAVA_OPTS=-Xms1G -Xmx1G
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    networks:
      - jaeger-net
      - opensearch-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 10

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    expose:
      - "5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]' # Define the OpenSearch nodes that OpenSearch Dashboards will query
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    networks:
      - opensearch-net
    depends_on:
      opensearch:
        condition: service_healthy


  jaeger:
    image: jaegertracing/jaeger:2.7.0
    container_name: jaeger
    command: ["--config=/etc/jaeger/jaeger-config.yaml"]
    volumes:
      - ${PWD}/tests/jaeger/jaeger-config.yaml:/etc/jaeger/jaeger-config.yaml
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "16686:16686"  # Jaeger UI
    expose:
      - "16686"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - jaeger-net

volumes:
  opensearch-data:

networks:
  jaeger-net:
  opensearch-net:
