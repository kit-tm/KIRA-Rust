[package]
name = "kirad"
version = "0.1.0"
description = "A kira routing daemon"
license = ""
authors.workspace = true
homepage.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["api", "swagger_doc"]
api = ["kira-lib/api"]
swagger_doc = ["kira-lib/swagger_doc"]
# default routing table bucket size: 3
small_buckets = []
# tracing support for tokio-console
tokio-console = ["console-subscriber"]
# tracing output to OTel [OTel](https://opentelemetry.io/).
otel = [
  "tracing-opentelemetry",
  "opentelemetry/trace",
  "opentelemetry-otlp/logs",
  "opentelemetry-otlp/grpc-tonic",
  "opentelemetry_sdk/trace",
  "opentelemetry-semantic-conventions",
]

[lib]
name = "kirad_lib"
path = "src/lib.rs"

[[bin]]
name = "kirad"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.5", features = ["derive", "env"] }
derive_more = { workspace = true }

kira-lib = { path = "../kira-lib", default-features = false, features = [
  "format-cbor",
  "udp-tokio",
] }
kira-forwarding = { path = "../kira-forwarding", default-features = false, features = [
  "nft",
] }
kira-r2kad = { path = "../kira-r2kad", default-features = false, features = [
  "serde",
] }

futures = { workspace = true }
signal-hook = "0.4.4"
signal-hook-tokio = { version = "0.4", features = ["futures-v0_3"] }
tokio = { workspace = true, default-features = true, features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "signal",
  "tracing",
] }
itertools = { version = "0.15", optional = true }

log = { workspace = true }
tracing = { workspace = true, features = ["attributes"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
# tokio debug console
console-subscriber = { version = "0.5", optional = true }
# opentelemetry
tracing-opentelemetry = { version = "0.33", optional = true }
opentelemetry = { version = "0.32", optional = true }
# opentelemetry tracer
opentelemetry_sdk = { version = "0.32.1", optional = true }
# batched tracer export to OTel instance using OTLP format
opentelemetry-otlp = { version = "0.32", optional = true }
opentelemetry-semantic-conventions = { version = "0.32.1", optional = true }


[package.metadata.deb]
name = "kirad"
section = "net"
depends = "$auto, iproute2, nftables"
copyright = "Karlsruhe Institute of Technology (c) 2024. All rights reserved."
maintainer-scripts = "../pkg/"
assets = [
  [
    "target/release/kirad",
    "/usr/local/bin/kirad",
    "755",
  ],
  [
    "conf/nftables.conf",
    "/usr/local/share/kira/nftables.conf",
    "644",
  ],
]
systemd-units = { enable = false } #, enable = false, start = false }
