[package]
name = "kirad"
version = "0.1.0"
description = "A kira routing daemon"
license = ""
authors.workspace = true
homepage.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["tokio-console", "api", "swagger_doc"]
api = ["kira-lib/api"]
swagger_doc = ["kira-lib/swagger_doc"]
# default routing table bucket size: 3
small_buckets = []
# enable tracing support for tokio-console
tokio-console = ["console-subscriber"]

[lib]
name = "kirad_lib"
path = "src/lib.rs"

[[bin]]
name = "kirad"
path = "src/main.rs"

[dependencies]
chrono = { workspace = true }
clap = { version = "4.5.17", features = ["derive", "env"] }
# Debug tool
console-subscriber = { version = "0.4.0", optional = true }
derive_more = { workspace = true }
futures = { workspace = true }
humantime = "2.1.0"
log = { workspace = true }
kira-lib = { path = "../kira-lib", default-features = false, features = [
    "format-mp",
    "udp-tokio",
]}
kira-forwarding = { path = "../kira-forwarding", default-features = false, features = ["nft"] }
kira-r2kad = { path = "../kira-r2kad", default-features = false, features = ["serde"] }
signal-hook = "0.3.17"
signal-hook-tokio = { version = "0.3.1", features = ["futures-v0_3"] }
tokio = { workspace = true, default-features = true, features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "signal",
  "tracing",
]}
itertools = { version = "0.13.0", optional = true }
tracing = { workspace = true, features = ["attributes"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }


[package.metadata.deb]
name = "kirad"
section = "net"
depends = "$auto, iproute2, nftables"
copyright = "Karlsruhe Institute of Technology (c) 2024. All rights reserved."
maintainer-scripts = "../pkg/"
assets = [
  [
    "target/release/kirad",
    "/usr/local/bin/kirad",
    "755",
  ],
  [
    "conf/nftables.conf",
    "/usr/local/share/kira/nftables.conf",
    "644",
  ],
]
systemd-units = { enable = false } #, enable = false, start = false }
