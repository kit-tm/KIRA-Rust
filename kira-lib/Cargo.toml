[package]
name = "kira-lib"
version = "0.1.0"
description = "KIRA integration library"
license = ""
authors.workspace = true
homepage.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["format-cbor", "udp-tokio", "api", "swagger_doc"]
#bench = ["log/release_max_level_off"]
api = ["axum", "hex", "sha2", "base64", "serde", "serde/derive", "serde_json"]
swagger_doc = ["utoipa", "utoipa-swagger-ui", "api", "itertools"]
udp-tokio = ["tokio/net"]
# CBOR message format
format-cbor = ["serde_cbor", "serde"]
# rust message pack (de)serialization support
format-mp = ["rmp-serde", "serde"]
# json (de)serialization support [debug]
format-json = ["serde_json", "serde"]
# traces over all components
distributed-tracing = []

[lib]
name = "kira_lib"
path = "src/lib.rs"


[dependencies]
derive_more = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
kira-r2kad = { path = "../kira-r2kad", features = ["serde"] }
kira-forwarding = { path = "../kira-forwarding", default-features = false }
tokio = { workspace = true, features = ["rt", "time", "tracing", "sync"] }
netlink-packet-core = { workspace = true }
netlink-packet-route = { workspace = true }
netlink-proto = { workspace = true }
# REST server backend
axum = { version = "0.8.9", features = ["json"], optional = true }
serde = { workspace = true, optional = true }
rmp-serde = { workspace = true, optional = true }
serde_cbor = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
# TODO: support other hashing algorithms
sha2 = { workspace = true, optional = true }
base64 = { version = "0.23.0", optional = true }
# swagger documentation
utoipa = { version = "5.5.0", optional = true }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"], optional = true }
itertools = { version = "0.15.0", optional = true }
tracing = { workspace = true, features = ["attributes"] }
trait-variant = { workspace = true }


[dev-dependencies]
anyhow = "1.0.104"
ntest = "0.9.5"
petgraph = { version = "0.8.3", features = ["serde", "serde-1"] }
tokio = { workspace = true, features = [
  "macros",
  "rt",
  "time",
  "tracing",
  "sync",
] }
